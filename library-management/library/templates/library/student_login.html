{% extends "library/base.html" %}
{% block title %}Student Login &middot; LibraryHub{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card">
      <div class="card-body p-4">
        <h3 class="fw-bold mb-1"><i class="bi bi-mortarboard text-primary me-2"></i>Student Login</h3>
        <p class="text-muted">Enter your roll number and password.</p>
        <form method="post" novalidate>
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label">Roll number</label>
            {{ form.roll_number }}
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            {{ form.password }}
          </div>
          <button type="submit" class="btn btn-primary w-100">Log in</button>
        </form>
        <hr />
        <p class="text-center mb-0 small">Not registered yet?
          <a href="{% url 'student_register' %}">Create an account</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
